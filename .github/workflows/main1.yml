name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        shell: powershell
        run: |
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" -Value 0 -Force

          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" -Value 0 -Force

          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "SecurityLayer" -Value 0 -Force

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Restart-Service TermService -Force

      - name: Create RDP User
        shell: powershell
        run: |
          $password = -join ((48..57 + 65..90 + 97..122) | Get-Random -Count 16 | % {[char]$_})

          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          }

          Add-LocalGroupMember -Group "Administrators" -Member "RDP" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP" -ErrorAction SilentlyContinue

          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

      - name: Install Tailscale
        shell: powershell
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"

          $installerPath = Join-Path $env:TEMP "tailscale.msi"

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath

          Start-Process msiexec.exe `
            -ArgumentList "/i `"$installerPath`" /quiet /norestart" `
            -Wait

          Remove-Item $installerPath -Force

      - name: Connect Tailscale
        shell: powershell
        run: |
          $tailscale = Join-Path $env:ProgramFiles "Tailscale\tailscale.exe"

          & $tailscale up `
            --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" `
            --hostname="gh-runner-$env:GITHUB_RUN_ID"

          $ip = $null

          for ($i = 0; $i -lt 12; $i++) {
              $ip = & $tailscale ip -4

              if ($ip) {
                  break
              }

              Start-Sleep -Seconds 5
          }

          if (-not $ip) {
              throw "Failed to obtain Tailscale IP."
          }

          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

      - name: Verify RDP
        shell: powershell
        run: |
          Test-NetConnection $env:TAILSCALE_IP -Port 3389

      - name: Display RDP Info
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=============================="
          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host "=============================="

            - name: Keep Alive
        shell: powershell
        run: |
          while ($true) {
            Write-Host "$(Get-Date) Runner masih hidup..."
            Start-Sleep -Seconds 300
          }
